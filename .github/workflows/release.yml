name: release
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest,   name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xorg-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Headless verify
        shell: bash
        run: |
          if [ -f build/Release/isekai.exe ]; then build/Release/isekai.exe --verify-headless;
          else ./build/isekai --verify-headless; fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/isekai
          cp -r assets shaders dist/isekai/ 2>/dev/null || true
          cp build/isekai dist/isekai/ 2>/dev/null || cp build/Release/isekai.exe dist/isekai/
          cd dist && cmake -E tar cf ../isekai-${{ matrix.name }}.zip --format=zip isekai
      - uses: actions/upload-artifact@v4
        with:
          name: isekai-${{ matrix.name }}
          path: isekai-${{ matrix.name }}.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('nightly-{0}', github.run_number) }}
          files: out/*.zip
