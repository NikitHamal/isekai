name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Headless verify
        shell: bash
        run: |
          if [ -f build/Release/isekai.exe ]; then build/Release/isekai.exe --verify-headless; else ./build/isekai --verify-headless; fi
      - name: Package (isekai + assets + README at zip root)
        shell: bash
        run: |
          mkdir -p stage
          cp -r assets stage/assets
          cp README.md stage/README.md
          if [ -f build/Release/isekai.exe ]; then cp build/Release/isekai.exe stage/; else cp build/isekai stage/; fi
          cd stage && cmake -E tar cf ../isekai-${{ matrix.name }}.zip --format=zip .
      - uses: actions/upload-artifact@v4
        with:
          name: isekai-${{ matrix.name }}
          path: isekai-${{ matrix.name }}.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.0-playable' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.0-playable (latest main)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: out/*.zip
